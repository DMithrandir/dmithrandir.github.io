<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var mode = 'dark'; /* 方案 B 深色单主题 */
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) {}
    })();
  </script>
  {%- seo -%}
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme-b.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {%- if page.math %}
  <script>
    window.MathJax = {
      tex2jax: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      },
      TeX: {
        extensions: ['AMSmath.js', 'AMSsymbols.js'],
        Macros: {
          E: '\\mathbb{E}',
          R: '\\mathbb{R}',
          dd: '\\mathrm{d}',
          KL: 'D_{\\mathrm{KL}}',
          ind: '\\;\\;\\;\\;'
        }
      },
      showMathMenu: false,
      messageStyle: 'none'
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-AMS_CHTML"></script>
  {%- endif %}
  {%- feed_meta -%}
</head>
