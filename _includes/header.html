<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
      <span class="brand-seal" aria-hidden="true">灰</span>
      <span class="brand-text">
        <span class="brand-name">{{ site.title }}</span>
        <span class="brand-sub">{{ site.tagline | default: 'Grey Area · AI 治理与系统笔记' }}</span>
      </span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="is-active" aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/trust-and-safety/' | relative_url }}"{% if page.url contains '/trust-and-safety' or page.url contains '/governance' or page.categories contains '治理框架' %} class="is-active" aria-current="page"{% endif %}>审核策略</a>
      <a href="{{ '/mcmc/' | relative_url }}"{% if page.url contains '/mcmc' or page.series == 'noise-mcmc' %} class="is-active" aria-current="page"{% endif %}>研究笔记</a>
      <a href="{{ '/series/ai-harness/' | relative_url }}"{% if page.url contains '/series/ai-harness' or page.series == 'ai-harness' %} class="is-active" aria-current="page"{% endif %}>AI 工程</a>
      <a class="is-opt{% if page.url contains '/blog' or page.url contains '/archive' %} is-active{% endif %}" href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' or page.url contains '/archive' %} aria-current="page"{% endif %}>文章</a>
      <a class="is-opt{% if page.url contains '/projects' %} is-active{% endif %}" href="{{ '/projects/' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>项目</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="is-active" aria-current="page"{% endif %}>关于</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深浅色模式" title="切换深浅色模式">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.5M12 18.9v2.5M4.4 12H1.9M22.1 12h-2.5M6.4 6.4 4.6 4.6M19.4 19.4l-1.8-1.8M17.6 6.4l1.8-1.8M4.6 19.4l1.8-1.8"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.8A8.3 8.3 0 0 1 9.2 3.8a8.6 8.6 0 1 0 11 11Z"/></svg>
      </button>
    </nav>
  </div>
</header>
