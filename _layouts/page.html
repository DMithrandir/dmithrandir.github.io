---
layout: default
---
<article class="wrap page{% if page.wide %} page-wide{% endif %}">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.description %}<p class="post-lead">{{ page.description }}</p>{% endif -%}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
</article>
