---
layout: default
---
<article class="wrap page page-list">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif -%}
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.description %}<p class="post-lead">{{ page.description }}</p>{% endif -%}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</article>
