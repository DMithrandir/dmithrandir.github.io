[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnsafety"
version = "0.1.0"
description = "Reverse-noise safety audit: detect and bound adversarial noise that opposes the gradient direction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
test = ["pytest>=7.4"]

[project.scripts]
rnsafety = "rnsafety.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnsafety*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
