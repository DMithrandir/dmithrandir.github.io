<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="单次判定的输入窗口与四类盲区" style="font-family:'Source Han Serif SC','Noto Serif CJK SC','Songti SC',SimSun,serif">
      <rect width="800" height="470" fill="#191411"/>
      <text x="34" y="34" font-size="10.5" letter-spacing="1.4" fill="#9d9385">单次判定 · SINGLE-PASS</text>
      <text x="766" y="34" font-size="10.5" letter-spacing="1.4" fill="#9d9385" text-anchor="end">四类必要条件 · OUT OF WINDOW</text>

      <rect x="34" y="52" width="258" height="348" rx="6" fill="#201a15" stroke="#3a332b"/>
      <text x="52" y="80" font-size="14" font-weight="600" fill="#f1eadc">单次判定</text>
      <text x="52" y="97" font-size="10" fill="#9d9385" font-family="'Cascadia Mono',Consolas,monospace">single-pass</text>

      <rect x="52" y="114" width="222" height="62" rx="5" fill="#86aeb8" fill-opacity=".07" stroke="#86aeb8" stroke-opacity=".32"/>
      <text x="64" y="139" font-size="12" fill="#f1eadc">输入：均匀 8 帧 + 标题</text>
      <text x="64" y="158" font-size="10.5" fill="#9d9385">输出窗口一次用尽</text>

      <line x1="163" y1="176" x2="163" y2="200" stroke="#9d9385" marker-end="url(#ar1)"/>
      <defs>
        <marker id="ar1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9d9385"/></marker>
        <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9d9385"/></marker>
      </defs>

      <rect x="52" y="206" width="222" height="66" rx="5" fill="#d97056" fill-opacity=".06" stroke="#d97056" stroke-opacity=".38"/>
      <text x="64" y="232" font-size="12" fill="#f1eadc">结论：引流诈骗 0.93</text>
      <text x="64" y="251" font-size="10.5" fill="#9d9385">在输入子集内无懈可击</text>
      <text x="52" y="302" font-size="10.5" fill="#9d9385">输入固定 · 输出一次</text>
      <text x="52" y="320" font-size="10.5" fill="#9d9385">不查证 · 不回溯 · 可复现</text>
      <line x1="52" y1="338" x2="274" y2="338" stroke="#3a332b"/>
      <text x="52" y="360" font-size="10.5" fill="#d97056">判错的不是模型，是它没看到的东西</text>
      <text x="52" y="380" font-size="10.5" fill="#9d9385">换一条流程，证据才进得来</text>

      <line x1="292" y1="240" x2="310" y2="240" stroke="#3a332b"/>
      <line x1="310" y1="94" x2="310" y2="281" stroke="#3a332b"/>
      <path d="M310,94 L326,94 M310,161 L326,161 M310,221 L326,221 M310,281 L326,281" fill="none" stroke="#3a332b"/>

      <g>
        <rect x="330" y="62" width="436" height="64" rx="5" fill="#191411" stroke="#3a332b"/>
        <rect x="330" y="62" width="3" height="64" fill="#d97056"/>
        <text x="346" y="84" font-size="12.5" font-weight="600" fill="#f1eadc">时序盲区</text>
        <text x="346" y="102" font-size="10.5" fill="#9d9385">第 31 秒的转述语气：「以上都是骗子的标准话术」</text>
        <text x="346" y="118" font-size="10.5" fill="#9d9385">均匀抽帧抽到两头，中间被跳过去</text>
      </g>
      <g>
        <rect x="330" y="136" width="436" height="50" rx="5" fill="#191411" stroke="#3a332b"/>
        <rect x="330" y="136" width="3" height="50" fill="#86aeb8"/>
        <text x="346" y="158" font-size="12.5" font-weight="600" fill="#f1eadc">像素精度盲区</text>
        <text x="346" y="176" font-size="10.5" fill="#9d9385">卡号 12 位是道具；二维码指向公益反诈页</text>
      </g>
      <g>
        <rect x="330" y="196" width="436" height="50" rx="5" fill="#191411" stroke="#3a332b"/>
        <rect x="330" y="196" width="3" height="50" fill="#c2ab77"/>
        <text x="346" y="218" font-size="12.5" font-weight="600" fill="#f1eadc">外部上下文盲区</text>
        <text x="346" y="236" font-size="10.5" fill="#9d9385">政务认证 · 11 周同系列 · 前两集放行</text>
      </g>
      <g>
        <rect x="330" y="256" width="436" height="50" rx="5" fill="#191411" stroke="#3a332b"/>
        <rect x="330" y="256" width="3" height="50" fill="#86aeb8"/>
        <text x="346" y="278" font-size="12.5" font-weight="600" fill="#f1eadc">政策版本盲区</text>
        <text x="346" y="296" font-size="10.5" fill="#9d9385">豁免条款在政策库，带生效版本号，不在权重里</text>
      </g>

      <g>
        <rect x="330" y="330" width="436" height="70" rx="5" fill="#86aeb8" fill-opacity=".05" stroke="#86aeb8" stroke-opacity=".28"/>
        <text x="346" y="352" font-size="10.5" fill="#86aeb8">取回来的四类证据，对应四个工具：政策检索 / 判例库 / 多模态算子 / 账号画像</text>
        <text x="346" y="372" font-size="10.5" fill="#9d9385">代价：端到端 5–8 秒，相对 L1 快筛 50–100 倍（示意量级）</text>
        <text x="346" y="390" font-size="10.5" fill="#9d9385">所以它不能全量跑，只能跑「拿不准且判错不可逆」的那一小段</text>
      </g>

      <text x="34" y="440" font-size="11" fill="#cfc5b4">判定所需的证据不在像素里：在时间轴、在工具、在政策库、在账号历史。单次判定的输入集合，决定了它的天花板。</text>
    </svg>