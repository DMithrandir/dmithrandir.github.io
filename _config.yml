# ===== 站点基本信息 =====
title: 灰度
description: >-
  AI 内容治理、人机协同、模型评测与系统工程的实践笔记：不写新闻，只写做过、验证过、能复用的东西。
author: 灰度
url: "https://dmithrandir.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

# 站点副标题（页眉品牌区使用，可按喜好改）
tagline: "Grey Area · AI 治理与系统笔记"

# ===== 主题 =====
# 不使用任何主题 gem：布局在 _layouts/，组件在 _includes/，样式在 assets/css/。

# ===== Markdown =====
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  # 数学公式：把 $$...$$（行间）与 \(...\)（行内）转成 MathJax 可读的 script 标签，
  # 同时保护公式里的下划线、星号不被 Markdown 当成强调。只在 page.math 为真时加载 MathJax。
  math_engine: mathjax

# ===== 插件（均在 GitHub Pages 白名单内）=====
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ===== 不参与构建的文件 =====
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor
