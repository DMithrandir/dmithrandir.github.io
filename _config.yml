# ===== 站点基本信息 =====
title: 彭德馨
description: >-
  内容风控与 AI 应用：判定机制设计、政策与知识系统、评测与标注质量。
url: "https://dmithrandir.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

# ===== 主题 =====
# 本站不使用任何主题 gem：布局在 _layouts/，组件在 _includes/，样式在 assets/css/。
# 之前用的 jekyll-theme-minimal / minima 都已移除，改版时不再受主题约束。

# ===== Markdown =====
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# ===== 插件（均在 GitHub Pages 白名单内）=====
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# ===== 不参与构建的文件 =====
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - vendor
