- index: "01"
  key: noise-mcmc
  title: "MCMC 与噪声注入：一条不等式能做什么"
  url: "/mcmc/"
  years: "2011 → 2026"
  meta: "8 篇 · 含交互实验台"
  blurb: >-
    给马尔可夫链的提议注入零均值噪声，一条不等式说它让提议离目标更近。八篇从定理与证明讲到四组对照实验，
    再把它反过来做成审计工具、接到推理时缩放上；顺带证伪了我自己论文里对「为什么有用」的解释。
    另有一个可以拖的交互实验台，和一份 2020 年之后的采样器地图。
  tags:
    - MCMC
    - 噪声注入
    - 方差匹配
    - 可复现

