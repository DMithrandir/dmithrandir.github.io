- index: "03"
  key: gold-macro
  title: "黄金：债务、利率与一次证伪"
  url: "/gold/"
  years: "2026"
  meta: "3 篇 · 含回测与代码"
  blurb: >-
    金价从 5,600 跌到 3,500，央行还在每个季度买 300 吨。三篇从债务流动性讲到实际利率模型，再把那个模型拿去回测：
    发现「便宜」的信号方向是反的，但同一组数据证实 2022 年之后金价对利率的斜率由负转正。
    一个弱判断改了两次依据，倾向没变。
  tags:
    - 黄金
    - 实际利率
    - 央行购金
    - 样本外回测
