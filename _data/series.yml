# 系列元数据。文章通过 front matter 里的 series: <key> + series_part: <n> 关联，
# 目录由 site.posts 动态生成，这里只放系列层面的文案。

noise-mcmc:
  title: "噪声、不等式与采样器"
  subtitle: "噪声为什么能让采样更快，以及它之后的两步"
  url: "/mcmc/"
  years: "2011 → 2026"
  blurb: >-
    给马尔可夫链的提议加零均值噪声，它生成的候选反而更贴近目标分布。Franzke–Kosko 的不等式把这件事写成一个可证的量：
    目标与提议密度之间的相对熵在期望意义下变小——但它量的是「提议」不是「链」，无约束的噪声只等价于调方差。
    这一组从定理、证明讲到对照实验，再把同一条不等式反过来做成审计工具、接到推理时缩放上。

governance:
  title: "治理的机制"
  subtitle: "判定、政策、知识系统：三块被写在一起的模块"
  url: "/governance/"
  years: "2022 → 2026"
  blurb: >-
    内容治理不是"多审几条"，而是把判不了的、下不去的、记不住的分别做成机制。
    这一组拆开讲：灰度判定怎么做成流程、政策怎么在几十个市场里生效、判定口径怎么收敛成唯一来源。

ai-harness:
  title: "AI Harness"
  subtitle: "模型之外，让任务真正跑起来的那一层"
  url: "/series/ai-harness/"
  years: "2026 →"
  blurb: >-
    同样的模型，换一层外框，完成率可以差一倍。这里记录我自己搭、自己测、自己踩坑的过程：
    上下文怎么管、工具怎么给、评测怎么复现、失败长什么样。
