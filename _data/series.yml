# 系列元数据。文章通过 front matter 里的 series: <key> + series_part: <n> 关联，
# 目录由 site.posts 动态生成，这里只放系列层面的文案。

noise-mcmc:
  title: "噪声、不等式与采样器"
  subtitle: "噪声为什么能让采样更快，以及它之后的两步"
  url: "/mcmc/"
  years: "2011 → 2026"
  blurb: >-
    给马尔可夫链的提议加零均值噪声，它生成的候选反而更贴近目标分布。Franzke–Kosko 的不等式把这件事写成一个可证的量：
    目标与提议密度之间的相对熵在期望意义下变小——但它量的是「提议」不是「链」，无约束的噪声只等价于调方差。
    这一组从定理、证明讲到对照实验，再把同一条不等式反过来做成审计工具、接到推理时缩放上。
    网页版另有两件东西：一个可以拖的交互实验台，一份 2020 年之后的采样器地图。

governance:
  title: "内容治理的机制"
  subtitle: "一份总纲、十一个模块，和几篇跨层的长文"
  url: "/governance/"
  years: "2022 → 2026"
  blurb: >-
    从一条投稿往下拆：它先被哪些信号发现、按什么规则判定、由谁审、审错了谁来推翻、
    最后用什么口径证明真的变好了。总纲给五层链路，十一个模块各管一段；
    另几篇长文把整条链路串起来讲，或者专门拆一个口径。

ai-harness:
  title: "AI Harness"
  subtitle: "模型之外，让任务真正跑起来的那一层"
  url: "/series/ai-harness/"
  years: "2026 →"
  blurb: >-
    同样的模型，换一层外框，完成率可以差一倍。这里记录我自己搭、自己测、自己踩坑的过程：
    上下文怎么管、工具怎么给、评测怎么复现、失败长什么样。

gold-macro:
  title: "黄金：债务、利率与一次证伪"
  subtitle: "金价跌了 37%，央行还在买，一个模型说便宜，回测说方向反了"
  url: "/gold/"
  years: "2026 →"
  blurb: >-
    2026 年 1 月黄金创下 5,600 美元的纪录，11 月跌到 3,500。同一时间，全球央行每个季度买 300 多吨，实物 ETF 持仓在创纪录。
    三篇从债务流动性开始，把因果链拆到利率，再用一个估值模型给「贵还是便宜」算个数，最后把那个模型拿去回测，
    发现它的信号方向是反的——但同一组数据证实央行制度确实让黄金对利率脱敏。
